#
# CircleCI 2.0
#
version: 2
jobs:
  build:
    docker:
      - image: cimg/node:26.13
    working_directory: ~/works
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build dist
          command: |
            npm run build
            test -s dist/index.html
            test -s dist/webpack.png
      # The publish job runs target/builder.sh from the shared workspace.
      - run:
          name: Fetch builder for publish
          command: |
            mkdir -p target
            curl -sLo target/builder.sh toast.sh/builder
      - persist_to_workspace:
          root: ~/works
          paths:
            - .
  publish:
    docker:
      - image: opspresso/awscli
    working_directory: ~/works
    steps:
      - attach_workspace:
          at: ~/works
      - run:
          name: Publish
          command: |
            bash ./target/builder.sh
  slack:
    docker:
      - image: circleci/python
    working_directory: ~/works
    steps:
      - attach_workspace:
          at: ~/works
      - run:
          name: Slack
          command: |
            bash ./target/builder.sh

# Advanced Settings
# - Build forked pull requests
# - Pass secrets to builds from forked pull requests
# - Only build pull requests

workflows:
  version: 2
  apply:
    jobs:
      - build
      - publish:
          requires:
            - build
          filters:
            branches:
              only:
                - master
