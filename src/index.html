<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.3.1/css/all.css">
  <title>Hello, world!</title>
</head>

<body>

  <main>
    <section class="p-5 mb-4 bg-body-tertiary text-center">
      <div class="container">
        <h1><img src="webpack.png" alt="webpack"></h1>
        <p>
          <button type="button" class="btn btn-primary btn-thumbs-up"><i class="fa-regular fa-thumbs-up"></i> <span
              id="thumbs-up-count">0</span></button>
          <button type="button" class="btn btn-danger btn-thumbs-down"><i class="fa-regular fa-thumbs-down"></i> <span
              id="thumbs-down-count">0</span></button>
        </p>
        <p id="drop-rate"></p>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-4.0.0.min.js"
    integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="/counter.js"></script>
  <script src="/dropper.js"></script>

</body>

</html>
