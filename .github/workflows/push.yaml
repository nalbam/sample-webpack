name: build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm

      # Checks that ./build.sh exits non-zero and stops when npm ci or the build fails.
      - name: Test build.sh
        run: npm test

      # Run npm directly so each step reports its own failure.
      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Check dist
        run: |
          test -s dist/index.html
          test -s dist/main.bundle.js
          test -s dist/main.bundle.css
          test -s dist/webpack.png
          test -s dist/favicon.ico

      # --pull uses the current nginx:1.30-alpine patch, which nginx -v prints.
      - name: Build Docker image for check
        run: |
          docker build --pull -t "${{ github.event.repository.name }}:check" .
          docker run --rm "${{ github.event.repository.name }}:check" nginx -v

      - name: Run Docker image check
        run: |
          docker run --name check -p 8080:80 -d "${{ github.event.repository.name }}:check"
          for _ in $(seq 1 10); do
            curl -fsS http://localhost:8080/ -o /dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q "Hello, world!"
          for path in main.bundle.js main.bundle.css webpack.png favicon.ico; do
            curl -fsS -o /dev/null "http://localhost:8080/${path}"
          done
          docker rm -f check

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same platforms as the release image, without pushing.
      - name: Build release platforms without push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false

      # Tag runs hand the checked dist/ to the release image job.
      - name: Upload dist
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
