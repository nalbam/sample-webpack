name: build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      # Run npm directly: build.sh always exits 0 through _success.
      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Check dist
        run: |
          test -s dist/index.html
          test -s dist/webpack.png

      - name: Build Docker image for check
        run: docker build -t "${{ github.event.repository.name }}:check" .

      - name: Run Docker image check
        run: |
          docker run --name check -p 8080:80 -d "${{ github.event.repository.name }}:check"
          for _ in $(seq 1 10); do
            curl -fsS http://localhost:8080/ -o /dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q "Hello, world!"
          curl -fsS -o /dev/null http://localhost:8080/webpack.png
          docker rm -f check

      # Tag runs hand the checked dist/ to the release image job.
      - name: Upload dist
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
