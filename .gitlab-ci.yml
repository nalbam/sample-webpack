# gitlab-ci

stages:
  - build
  - docker

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME

# Install the locked dependencies and build dist/ for the Dockerfile.
dist:
  stage: build
  image: node:26.13-alpine
  script:
    - npm ci
    - npm run build
    - test -s dist/index.html
    - test -s dist/webpack.png
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

docker:
  stage: docker
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - dist
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build --pull -f Dockerfile -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
